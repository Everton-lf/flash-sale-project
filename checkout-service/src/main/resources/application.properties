quarkus.http.port=8080

# Conexao com o Banco de Dados PostgreSQL do Checkout (db_checkout)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=root
quarkus.datasource.password=rootpassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db_checkout
quarkus.hibernate-orm.database.generation=drop-and-create

# Conexao com o Redis
quarkus.redis.hosts=redis://localhost:6379

# Conexao com o RabbitMQ (Mensageria Assincrona)
mp.messaging.outgoing.order-created.connector=smallrye-rabbitmq
mp.messaging.outgoing.order-created.exchange.name=flashsale-exchange
mp.messaging.outgoing.order-created.routing-key=order.created

mp.messaging.incoming.order-compensation.connector=smallrye-rabbitmq
mp.messaging.incoming.order-compensation.queue.name=order-compensation
mp.messaging.incoming.order-compensation.exchange.name=flashsale-exchange
mp.messaging.incoming.order-compensation.routing-key=order.compensation