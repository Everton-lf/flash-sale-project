quarkus.http.port=8081

# Conexão com o Banco de Dados PostgreSQL do Order Processor (db_order_processor)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=root
quarkus.datasource.password=rootpassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db_order_processor
quarkus.hibernate-orm.database.generation=drop-and-create

# Configuração de Mensageria RabbitMQ
mp.messaging.incoming.order-created.connector=smallrye-rabbitmq
mp.messaging.incoming.order-created.queue.name=order-created
mp.messaging.incoming.order-created.exchange.name=flashsale-exchange
mp.messaging.incoming.order-created.routing-key=order.created

mp.messaging.outgoing.order-compensation.connector=smallrye-rabbitmq
mp.messaging.outgoing.order-compensation.exchange.name=flashsale-exchange
mp.messaging.outgoing.order-compensation.routing-key=order.compensation